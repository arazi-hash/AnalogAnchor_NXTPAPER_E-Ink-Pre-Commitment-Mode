name: Verify CoreFetch sync

on:
  push:
    branches: ['**']
    paths:
      - shizu_store.json
      - release/public-signing-certificate.pem
      - release/public-signing-certificate.sha256
      - scripts/check_corefetch_sync.py
      - .github/workflows/corefetch-sync.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: corefetch-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify public APK and poll the CoreFetch catalog
        run: |
          python3 scripts/check_corefetch_sync.py \
            --aapt2 "$ANDROID_HOME/build-tools/36.0.0/aapt2" \
            --apksigner "$ANDROID_HOME/build-tools/36.0.0/apksigner"
